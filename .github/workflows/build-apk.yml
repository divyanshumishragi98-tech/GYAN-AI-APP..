name: Build Gyan AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Pillow
      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade Pillow

      # 4. Create Gyan AI App Icon
      - name: Create Gyan AI App Icon
        run: |
          mkdir -p assets

          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          SIZE = 1024
          img = Image.new("RGB", (SIZE, SIZE), "#080C12")
          draw = ImageDraw.Draw(img)

          cx = SIZE // 2
          cy = SIZE // 2

          margin = 45

          draw.rounded_rectangle(
              (margin, margin, SIZE-margin, SIZE-margin),
              radius=230,
              fill="#111827"
          )

          r = 350

          draw.ellipse(
              (cx-r, cy-r, cx+r, cy+r),
              outline="#38BDF8",
              width=24
          )

          r2 = 305

          draw.ellipse(
              (cx-r2, cy-r2, cx+r2, cy+r2),
              outline="#2563EB",
              width=8
          )

          nodes = [
              (cx-275, cy-240),
              (cx+275, cy-240),
              (cx-275, cy+240),
              (cx+275, cy+240)
          ]

          for x, y in nodes:
              draw.line(
                  (cx, cy, x, y),
                  fill="#38BDF8",
                  width=7
              )

          for x, y in nodes:
              draw.ellipse(
                  (x-27, y-27, x+27, y+27),
                  fill="#38BDF8"
              )

          font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              360
          )

          text = "G"

          bbox = draw.textbbox(
              (0, 0),
              text,
              font=font
          )

          tw = bbox[2] - bbox[0]
          th = bbox[3] - bbox[1]

          draw.text(
              (cx-tw//2, cy-th//2-35),
              text,
              font=font,
              fill="#FFFFFF"
          )

          sx = cx + 215
          sy = cy - 235

          draw.polygon(
              [
                  (sx, sy-45),
                  (sx+13, sy-13),
                  (sx+45, sy),
                  (sx+13, sy+13),
                  (sx, sy+45),
                  (sx-13, sy+13),
                  (sx-45, sy),
                  (sx-13, sy-13)
              ],
              fill="#FFFFFF"
          )

          img.save(
              "assets/icon.png",
              "PNG",
              optimize=True
          )

          print("Gyan AI icon created successfully")
          PY

      # 5. Install exact Expo SDK 54
      - name: Install Expo SDK 54
        run: |
          npm install expo@~54.0.37 --save-exact
          npx expo install expo-font@~14.0.12
          npx expo install @expo/vector-icons@^15.0.3

      # 6. Install EAS Update
      - name: Install EAS Update
        run: |
          npx expo install expo-updates

      # 7. Install App Features
      - name: Install App Features
        run: |
          npx expo install \
            expo-image-picker \
            expo-document-picker \
            expo-clipboard \
            expo-speech \
            expo-speech-recognition \
            expo-build-properties \
            expo-notifications \
            expo-print \
            expo-sharing \
            expo-file-system

      # 8. Install remaining dependencies
      - name: Install Dependencies
        run: |
          npm install

      # 9. Check important packages
      - name: Check Expo Versions
        run: |
          npm list \
            expo \
            expo-font \
            expo-updates \
            @expo/vector-icons \
            expo-image-picker \
            expo-document-picker \
            expo-speech \
            expo-speech-recognition \
            expo-notifications \
            expo-print \
            expo-sharing \
            expo-file-system \
            --depth=2

      # 10. Expo Doctor
      - name: Expo Doctor
        run: |
          npx expo-doctor

      # 11. Install EAS CLI
      - name: Install EAS CLI
        run: |
          npm install -g eas-cli

      # 12. Initialize EAS
      - name: Initialize EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas init \
            --account divyanshu143s-team \
            --non-interactive

    
    # 13. Build APK
      - name: Build Gyan AI APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive
