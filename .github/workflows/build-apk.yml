name: Build Gyan AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Project code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Python + Pillow
      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade Pillow

      # 4. Create Gyan AI App Icon
      - name: Create Gyan AI App Icon
        run: |
          mkdir -p assets

          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          SIZE = 1024

          # Dark background
          img = Image.new("RGB", (SIZE, SIZE), "#080C12")
          draw = ImageDraw.Draw(img)

          cx = SIZE // 2
          cy = SIZE // 2

          # Main rounded app background
          margin = 45
          draw.rounded_rectangle(
              (margin, margin, SIZE - margin, SIZE - margin),
              radius=230,
              fill="#111827"
          )

          # Outer glowing-style ring
          r = 350
          draw.ellipse(
              (cx-r, cy-r, cx+r, cy+r),
              outline="#38BDF8",
              width=24
          )

          # Inner ring
          r2 = 305
          draw.ellipse(
              (cx-r2, cy-r2, cx+r2, cy+r2),
              outline="#2563EB",
              width=8
          )

          # AI network nodes
          nodes = [
              (cx - 275, cy - 240),
              (cx + 275, cy - 240),
              (cx - 275, cy + 240),
              (cx + 275, cy + 240)
          ]

          # Lines connecting AI nodes
          for x, y in nodes:
              draw.line(
                  (cx, cy, x, y),
                  fill="#38BDF8",
                  width=7
              )

          # AI nodes
          for x, y in nodes:
              draw.ellipse(
                  (x-27, y-27, x+27, y+27),
                  fill="#38BDF8"
              )

          # Main G
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          font = ImageFont.truetype(
              font_path,
              360
          )

          text = "G"

          bbox = draw.textbbox(
              (0, 0),
              text,
              font=font
          )

          tw = bbox[2] - bbox[0]
          th = bbox[3] - bbox[1]

          draw.text(
              (
                  cx - tw // 2,
                  cy - th // 2 - 35
              ),
              text,
              font=font,
              fill="#FFFFFF"
          )

          # AI sparkle
          sx = cx + 215
          sy = cy - 235

          draw.polygon(
              [
                  (sx, sy-45),
                  (sx+13, sy-13),
                  (sx+45, sy),
                  (sx+13, sy+13),
                  (sx, sy+45),
                  (sx-13, sy+13),
                  (sx-45, sy),
                  (sx-13, sy-13)
              ],
              fill="#FFFFFF"
          )

          # Save icon
          img.save(
              "assets/icon.png",
              "PNG",
              optimize=True
          )

          # Verify
          check = Image.open("assets/icon.png")

          print("================================")
          print("GYAN AI ICON CREATED")
          print("Size:", check.size)
          print("Format:", check.format)
          print("Mode:", check.mode)
          print("================================")
          PY

      # 5. Install project dependencies
      - name: Install Dependencies
        run: |
          npm install

      # 6. Fix Expo dependencies
      - name: Fix Expo Dependencies
        run: |
          npx expo install --fix

      # 7. Check Expo project
      - name: Expo Doctor
        run: |
          npx expo-doctor

      # 8. Install EAS CLI
      - name: Install EAS CLI
        run: |
          npm install -g eas-cli

      # 9. Connect to EAS
      - name: Initialize EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas init \
            --account divyanshu143s-team \
            --non-interactive

      # 10. Build APK
      - name: Build Gyan AI APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive
